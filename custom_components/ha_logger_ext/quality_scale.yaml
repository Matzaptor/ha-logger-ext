rules:
  # Bronze
  action-exceptions: exempt       # no actions defined yet
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-unavailable: exempt       # no entities; background logging component
  has-tests: done
  log-when-unavailable: exempt     # no entities
  runtime-data: done
  test-before-setup: done          # initialize() raises ConfigEntryNotReady on failure
  unique-config-entry-per-device-or-service: done

  # Silver
  config-entry-unloading: done
  diagnostics: done
  docs-high-level-description: done
  integration-owner: done
  parallel-updates: exempt         # no entities or platforms
  reconfiguration-flow: done
  repair-issues: exempt            # no repairable issues defined yet
  stale-devices: exempt            # no devices

  # Gold
  devices: exempt                  # background service; no devices
  discovery: exempt                # not a discoverable device integration
  discovery-update-info: exempt    # no discovery
  docs-configuration-parameters: done
  docs-known-limitations: done
  entity-category: exempt          # no entities
  entity-device-class: exempt      # no entities
  entity-disabled-by-default: exempt  # no entities
  entity-translations: exempt      # no entities
  exception-translations: todo     # user-facing errors not yet translated
  icon-translations: exempt        # no entities
  strict-typing: todo              # type hints used throughout; mypy strict not yet enforced
  test-coverage: done
