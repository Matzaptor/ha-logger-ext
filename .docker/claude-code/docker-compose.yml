services:
  claude-code:
    build:
      context: ../..
      dockerfile: .docker/claude-code/Dockerfile
      args:
        USER_UID: ${HOST_UID:-1001}
        USER_GID: ${HOST_GID:-1001}
    userns_mode: host
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - claude-code-home:/home/claude
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    tty: true
    stdin_open: true

volumes:
  claude-code-home:
